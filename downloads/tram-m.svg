<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -18.83 59 26.83"><title>tram reference in m</title><desc>One SVG user unit equals one metres drawing unit. See accompanying DXF and evidence for assumptions.</desc><rect x="0" y="-3.5" width="45" height="3.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="0" y="-9" width="45" height="5.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="0" y="-12.5" width="45" height="3.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="-6" y="-3.5" width="6" height="3.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="45" y="-3.5" width="6" height="3.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="-6" y="-12.5" width="6" height="3.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="45" y="-12.5" width="6" height="3.5" fill="none" stroke="#111" stroke-width="0.015"/><text x="1" y="-1.4" font-family="Arial,sans-serif" font-size="0.5">Side platform: 3.5 m normal</text><text x="1" y="-6" font-family="Arial,sans-serif" font-size="0.5">Between platforms: 5.5 m</text><text x="1" y="-10.5" font-family="Arial,sans-serif" font-size="0.5">Side platform: 3.5 m normal</text><text x="0" y="2" font-family="Arial,sans-serif" font-size="0.45">Flat service length 45 m; section width 12.5 m before outer routes/buffers.</text><text x="0" y="4" font-family="Arial,sans-serif" font-size="0.4">End rectangles: illustrative 6 m ramps, assuming 0.3 m rise at 5%.</text><text x="0" y="5.5" font-family="Arial,sans-serif" font-size="0.4">Add crossing waiting areas. No shelters, tapered ends, rails or vehicle swept paths are specified.</text><text x="0" y="7" font-family="Arial,sans-serif" font-size="0.4">Length/height evidence: https://akkauppi.github.io/mitoitus/evidence.html#tram-length</text><text x="0" y="-15.5" font-family="Arial,sans-serif" font-size="0.35">TRAM STOP - STRAIGHT DEDICATED TRACK EXAMPLE - units: metres (m); geometry 1:1</text><text x="0" y="-16.7" font-family="Arial,sans-serif" font-size="0.23">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#tram-width</text><text x="0" y="-17.6" font-family="Arial,sans-serif" font-size="0.23">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
