<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1000 -16330 19000 21330"><title>parking reference in mm</title><desc>One SVG user unit equals one millimetres drawing unit. See accompanying DXF and evidence for assumptions.</desc><rect x="5000" y="-10000" width="7000" height="10000" fill="none" stroke="#111" stroke-width="15"/><rect x="0" y="-2500" width="5000" height="2500" fill="none" stroke="#111" stroke-width="15"/><rect x="12000" y="-2500" width="5000" height="2500" fill="none" stroke="#111" stroke-width="15"/><rect x="0" y="-5000" width="5000" height="2500" fill="none" stroke="#111" stroke-width="15"/><rect x="12000" y="-5000" width="5000" height="2500" fill="none" stroke="#111" stroke-width="15"/><rect x="0" y="-7500" width="5000" height="2500" fill="none" stroke="#111" stroke-width="15"/><rect x="12000" y="-7500" width="5000" height="2500" fill="none" stroke="#111" stroke-width="15"/><rect x="0" y="-10000" width="5000" height="2500" fill="none" stroke="#111" stroke-width="15"/><rect x="12000" y="-10000" width="5000" height="2500" fill="none" stroke="#111" stroke-width="15"/><text x="0" y="1000" font-family="Arial,sans-serif" font-size="300">8 bays, each 2500 mm x 5000 mm; shared aisle 7000 mm.</text><text x="0" y="2000" font-family="Arial,sans-serif" font-size="300">Module 17000 mm x 10000 mm. Dated Salo 2016 / TKK 2007 example.</text><text x="0" y="3000" font-family="Arial,sans-serif" font-size="250">No entrance, end manoeuvring, landscaping, snow, drainage or pedestrian-route extras included.</text><text x="0" y="4000" font-family="Arial,sans-serif" font-size="250">Area evidence: https://akkauppi.github.io/mitoitus/evidence.html#parking-area</text><text x="0" y="-13000" font-family="Arial,sans-serif" font-size="350">90 DEGREE PARKING - DATED SURFACE MODULE - units: millimetres (mm); geometry 1:1</text><text x="0" y="-14200" font-family="Arial,sans-serif" font-size="230">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#parking-layout</text><text x="0" y="-15100" font-family="Arial,sans-serif" font-size="230">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
