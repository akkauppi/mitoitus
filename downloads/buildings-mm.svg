<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1000 -28330 106000 37830"><title>buildings reference in mm</title><desc>One SVG user unit equals one millimetres drawing unit. See accompanying DXF and evidence for assumptions.</desc><rect x="0" y="-11000" width="26000" height="11000" fill="none" stroke="#111" stroke-width="15"/><text x="0" y="-13000" font-family="Arial,sans-serif" font-size="550">Slab module</text><text x="0" y="2000" font-family="Arial,sans-serif" font-size="450">26000 mm x 11000 mm</text><rect x="33000" y="-20000" width="20000" height="20000" fill="none" stroke="#111" stroke-width="15"/><text x="33000" y="-22000" font-family="Arial,sans-serif" font-size="550">Square point block</text><text x="33000" y="2000" font-family="Arial,sans-serif" font-size="450">20000 mm x 20000 mm</text><rect x="60000" y="-9000" width="9000" height="9000" fill="none" stroke="#111" stroke-width="15"/><text x="60000" y="-11000" font-family="Arial,sans-serif" font-size="550">Small block module</text><text x="60000" y="2000" font-family="Arial,sans-serif" font-size="450">9000 mm x 9000 mm</text><rect x="76000" y="-9500" width="6000" height="9500" fill="none" stroke="#111" stroke-width="15"/><text x="76000" y="-11500" font-family="Arial,sans-serif" font-size="550">Row dwelling</text><text x="76000" y="2000" font-family="Arial,sans-serif" font-size="450">6000 mm x 9500 mm</text><rect x="89000" y="-10000" width="15000" height="10000" fill="none" stroke="#111" stroke-width="15"/><text x="89000" y="-12000" font-family="Arial,sans-serif" font-size="550">Detached, one storey</text><text x="89000" y="2000" font-family="Arial,sans-serif" font-size="450">15000 mm x 10000 mm</text><text x="0" y="5000" font-family="Arial,sans-serif" font-size="500">Representative values within TKK 2007 ranges, not prescriptions. Repeat modules as labelled.</text><text x="0" y="7000" font-family="Arial,sans-serif" font-size="400">Other footprint evidence: https://akkauppi.github.io/mitoitus/evidence.html#building-rows</text><text x="0" y="8500" font-family="Arial,sans-serif" font-size="400">Detached-house evidence: https://akkauppi.github.io/mitoitus/evidence.html#building-detached</text><text x="0" y="-25000" font-family="Arial,sans-serif" font-size="350">BUILDING FOOTPRINT REPRESENTATIVES - units: millimetres (mm); geometry 1:1</text><text x="0" y="-26200" font-family="Arial,sans-serif" font-size="230">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#building-blocks</text><text x="0" y="-27100" font-family="Arial,sans-serif" font-size="230">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
