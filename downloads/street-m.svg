<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -26.33 40.5 31.33"><title>street reference in m</title><desc>One SVG user unit equals one metres drawing unit. See accompanying DXF and evidence for assumptions.</desc><rect x="0" y="-20" width="2.5" height="20" fill="none" stroke="#111" stroke-width="0.015"/><text x="0" y="1" font-family="Arial,sans-serif" font-size="0.25">Footway: 2.5 m</text><rect x="7.5" y="-20" width="1.75" height="20" fill="none" stroke="#111" stroke-width="0.015"/><text x="7.5" y="1" font-family="Arial,sans-serif" font-size="0.25">One-way cycle lane: 1.75 m</text><rect x="14.25" y="-20" width="3" height="20" fill="none" stroke="#111" stroke-width="0.015"/><text x="14.25" y="1" font-family="Arial,sans-serif" font-size="0.25">Tree strip (not root volume): 3 m</text><rect x="22.25" y="-20" width="3.25" height="20" fill="none" stroke="#111" stroke-width="0.015"/><text x="22.25" y="1" font-family="Arial,sans-serif" font-size="0.25">Bus-dimensioned local collector lane: 3.25 m</text><rect x="30.5" y="-20" width="8" height="20" fill="none" stroke="#111" stroke-width="0.015"/><text x="30.5" y="1" font-family="Arial,sans-serif" font-size="0.25">Light-rail corridor (Espoo 2010): 8 m</text><text x="0" y="3" font-family="Arial,sans-serif" font-size="0.3">Separate reference strips, not one prescribed street section. Strip length 20 m is illustrative.</text><text x="0" y="4" font-family="Arial,sans-serif" font-size="0.3">Espoo 2010 pp. 16-19. Add stops, kerbs, separation, edges, snow, utilities and other required space.</text><text x="0" y="-23" font-family="Arial,sans-serif" font-size="0.35">STREET-SPACE WIDTH STRIPS - units: metres (m); geometry 1:1</text><text x="0" y="-24.2" font-family="Arial,sans-serif" font-size="0.23">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#street-cad</text><text x="0" y="-25.1" font-family="Arial,sans-serif" font-size="0.23">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
