<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7000 -18830 59000 26830"><title>tram reference in mm</title><desc>One SVG user unit equals one millimetres drawing unit. See accompanying DXF and evidence for assumptions.</desc><rect x="0" y="-3500" width="45000" height="3500" fill="none" stroke="#111" stroke-width="15"/><rect x="0" y="-9000" width="45000" height="5500" fill="none" stroke="#111" stroke-width="15"/><rect x="0" y="-12500" width="45000" height="3500" fill="none" stroke="#111" stroke-width="15"/><rect x="-6000" y="-3500" width="6000" height="3500" fill="none" stroke="#111" stroke-width="15"/><rect x="45000" y="-3500" width="6000" height="3500" fill="none" stroke="#111" stroke-width="15"/><rect x="-6000" y="-12500" width="6000" height="3500" fill="none" stroke="#111" stroke-width="15"/><rect x="45000" y="-12500" width="6000" height="3500" fill="none" stroke="#111" stroke-width="15"/><text x="1000" y="-1400" font-family="Arial,sans-serif" font-size="500">Side platform: 3500 mm normal</text><text x="1000" y="-6000" font-family="Arial,sans-serif" font-size="500">Between platforms: 5500 mm</text><text x="1000" y="-10500" font-family="Arial,sans-serif" font-size="500">Side platform: 3500 mm normal</text><text x="0" y="2000" font-family="Arial,sans-serif" font-size="450">Flat service length 45000 mm; section width 12500 mm before outer routes/buffers.</text><text x="0" y="4000" font-family="Arial,sans-serif" font-size="400">End rectangles: illustrative 6000 mm ramps, assuming 300 mm rise at 5%.</text><text x="0" y="5500" font-family="Arial,sans-serif" font-size="400">Add crossing waiting areas. No shelters, tapered ends, rails or vehicle swept paths are specified.</text><text x="0" y="7000" font-family="Arial,sans-serif" font-size="400">Length/height evidence: https://akkauppi.github.io/mitoitus/evidence.html#tram-length</text><text x="0" y="-15500" font-family="Arial,sans-serif" font-size="350">TRAM STOP - STRAIGHT DEDICATED TRACK EXAMPLE - units: millimetres (mm); geometry 1:1</text><text x="0" y="-16700" font-family="Arial,sans-serif" font-size="230">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#tram-width</text><text x="0" y="-17600" font-family="Arial,sans-serif" font-size="230">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
