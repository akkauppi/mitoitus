odules as labelled.</text><text x="0" y="22.9659" font-family="Arial,sans-serif" font-size="1.3123">Other footprint evidence: https://akkauppi.github.io/mitoitus/evidence.html#building-rows</text><text x="0" y="27.8871" font-family="Arial,sans-serif" font-size="1.3123">Detached-house evidence: https://akkauppi.github.io/mitoitus/evidence.html#building-detached</text><text x="0" y="-82.021" font-family="Arial,sans-serif" font-size="1.1483">BUILDING FOOTPRINT REPRESENTATIVES - units: feet (ft); geometry 1:1</text><text x="0" y="-85.958" font-family="Arial,sans-serif" font-size="0.7546">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#building-blocks</text><text x="0" y="-88.9108" font-family="Arial,sans-serif" font-size="0.7546">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
