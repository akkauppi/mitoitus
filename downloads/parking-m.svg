<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -16.33 19 21.33"><title>parking reference in m</title><desc>One SVG user unit equals one metres drawing unit. See accompanying DXF and evidence for assumptions.</desc><rect x="5" y="-10" width="7" height="10" fill="none" stroke="#111" stroke-width="0.015"/><rect x="0" y="-2.5" width="5" height="2.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="12" y="-2.5" width="5" height="2.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="0" y="-5" width="5" height="2.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="12" y="-5" width="5" height="2.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="0" y="-7.5" width="5" height="2.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="12" y="-7.5" width="5" height="2.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="0" y="-10" width="5" height="2.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="12" y="-10" width="5" height="2.5" fill="none" stroke="#111" stroke-width="0.015"/><text x="0" y="1" font-family="Arial,sans-serif" font-size="0.3">8 bays, each 2.5 m x 5 m; shared aisle 7 m.</text><text x="0" y="2" font-family="Arial,sans-serif" font-size="0.3">Module 17 m x 10 m. Dated Salo 2016 / TKK 2007 example.</text><text x="0" y="3" font-family="Arial,sans-serif" font-size="0.25">No entrance, end manoeuvring, landscaping, snow, drainage or pedestrian-route extras included.</text><text x="0" y="4" font-family="Arial,sans-serif" font-size="0.25">Area evidence: https://akkauppi.github.io/mitoitus/evidence.html#parking-area</text><text x="0" y="-13" font-family="Arial,sans-serif" font-size="0.35">90 DEGREE PARKING - DATED SURFACE MODULE - units: metres (m); geometry 1:1</text><text x="0" y="-14.2" font-family="Arial,sans-serif" font-size="0.23">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#parking-layout</text><text x="0" y="-15.1" font-family="Arial,sans-serif" font-size="0.23">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
