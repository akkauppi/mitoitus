<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -36.55 70 40.55"><title>rescue reference in m</title><desc>One SVG user unit equals one metres drawing unit. See accompanying DXF and evidence for assumptions.</desc><circle cx="12" cy="-15" r="5" fill="none" stroke="#111" stroke-width="0.015"/><circle cx="12" cy="-15" r="10.5" fill="none" stroke="#111" stroke-width="0.015"/><circle cx="40" cy="-15" r="5.5" fill="none" stroke="#111" stroke-width="0.015"/><circle cx="40" cy="-15" r="12.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="60" y="-17" width="6" height="13" fill="none" stroke="#111" stroke-width="0.015"/><rect x="60" y="-17" width="8" height="13" fill="none" stroke="#777" stroke-width="0.015"/><text x="2" y="-28" font-family="Arial,sans-serif" font-size="0.6">Fire engine radii 5 m / 10.5 m</text><text x="29" y="-30" font-family="Arial,sans-serif" font-size="0.6">Aerial radii 5.5 m / 12.5 m</text><text x="57" y="-20" font-family="Arial,sans-serif" font-size="0.5">Set-up 6 m x 13 m</text><text x="57" y="-18.5" font-family="Arial,sans-serif" font-size="0.5">Target width 8 m</text><text x="0" y="0" font-family="Arial,sans-serif" font-size="0.5">Route width 3.5 m; clear height 4.2 m. HIKLU v1.3 (2024), pp. 7-13.</text><text x="0" y="1.5" font-family="Arial,sans-serif" font-size="0.5">Radius circles only: NOT a vehicle swept-path simulation. No driving allowances are added.</text><text x="0" y="3" font-family="Arial,sans-serif" font-size="0.5">Check vehicle model, driving/boom allowances, bearing capacity, gradients, reach and obstacles.</text><text x="0" y="-33" font-family="Arial,sans-serif" font-size="0.7">RESCUE REFERENCE GEOMETRY - units: metres (m); geometry 1:1</text><text x="0" y="-34.2" font-family="Arial,sans-serif" font-size="0.45">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#rescue</text><text x="0" y="-35.1" font-family="Arial,sans-serif" font-size="0.45">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
