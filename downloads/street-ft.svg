<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.2808 -86.3845 132.874 102.7887"><title>street reference in ft</title><desc>One SVG user unit equals one feet drawing unit. See accompanying DXF and evidence for assumptions.</desc><rect x="0" y="-65.6168" width="8.2021" height="65.6168" fill="none" stroke="#111" stroke-width="0.0492"/><text x="0" y="3.2808" font-family="Arial,sans-serif" font-size="0.8202">Footway: 8.2021 ft</text><rect x="24.6063" y="-65.6168" width="5.7415" height="65.6168" fill="none" stroke="#111" stroke-width="0.0492"/><text x="24.6063" y="3.2808" font-family="Arial,sans-serif" font-size="0.8202">One-way cycle lane: 5.7415 ft</text><rect x="46.752" y="-65.6168" width="9.8425" height="65.6168" fill="none" stroke="#111" stroke-width="0.0492"/><text x="46.752" y="3.2808" font-family="Arial,sans-serif" font-size="0.8202">Tree strip (not root volume): 9.8425 ft</text><rect x="72.9987" y="-65.6168" width="10.6627" height="65.6168" fill="none" stroke="#111" stroke-width="0.0492"/><text x="72.9987" y="3.2808" font-family="Arial,sans-serif" font-size="0.8202">Bus-dimensioned local collector lane: 10.6627 ft</text><rect x="100.0656" y="-65.6168" width="26.2467" height="65.6168" fill="none" stroke="#111" stroke-width="0.0492"/><text x="100.0656" y="3.2808" font-family="Arial,sans-serif" font-size="0.8202">Light-rail corridor (Espoo 2010): 26.2467 ft</text><text x="0" y="9.8425" font-family="Arial,sans-serif" font-size="0.9843">Separate reference strips, not one prescribed street section. Strip length 20 m is illustrative.</text><text x="0" y="13.1234" font-family="Arial,sans-serif" font-size="0.9843">Espoo 2010 pp. 16-19. Add stops, kerbs, separation, edges, snow, utilities and other required space.</text><text x="0" y="-75.4593" font-family="Arial,sans-serif" font-size="1.1483">STREET-SPACE WIDTH STRIPS - units: feet (ft); geometry 1:1</text><text x="0" y="-79.3963" font-family="Arial,sans-serif" font-size="0.7546">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#budget</text><text x="0" y="-82.3491" font-family="Arial,sans-serif" font-size="0.7546">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
