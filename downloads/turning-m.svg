<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -39.53 102.2 45.73"><title>turning reference in m</title><desc>One SVG user unit equals one metres drawing unit. See accompanying DXF and evidence for assumptions.</desc><circle cx="8" cy="-10" r="3" fill="none" stroke="#111" stroke-width="0.015"/><circle cx="8" cy="-10" r="6.5" fill="none" stroke="#111" stroke-width="0.015"/><circle cx="35" cy="-18" r="8.1" fill="none" stroke="#111" stroke-width="0.015"/><circle cx="35" cy="-18" r="15.2" fill="none" stroke="#111" stroke-width="0.015"/><text x="0" y="0" font-family="Arial,sans-serif" font-size="0.45">Car/van radii 3 m / 6.5 m</text><text x="20" y="0" font-family="Arial,sans-serif" font-size="0.45">Bus radii 8.1 m / 15.2 m</text><path d="M63 -10A3 3 0 0 0 60 -13" fill="none" stroke="#111" stroke-width="0.015"/><path d="M66.5 -10A6.5 6.5 0 0 0 60 -16.5" fill="none" stroke="#111" stroke-width="0.015"/><path d="M63 -10L66.5 -10" fill="none" stroke="#111" stroke-width="0.015"/><path d="M60 -13L60 -16.5" fill="none" stroke="#111" stroke-width="0.015"/><path d="M93.1 -10A8.1 8.1 0 0 0 85 -18.1" fill="none" stroke="#111" stroke-width="0.015"/><path d="M100.2 -10A15.2 15.2 0 0 0 85 -25.2" fill="none" stroke="#111" stroke-width="0.015"/><path d="M93.1 -10L100.2 -10" fill="none" stroke="#111" stroke-width="0.015"/><path d="M85 -18.1L85 -25.2" fill="none" stroke="#111" stroke-width="0.015"/><text x="58" y="0" font-family="Arial,sans-serif" font-size="0.45">Quarter-circle radius bands; same scale as the circles.</text><text x="0" y="3" font-family="Arial,sans-serif" font-size="0.5">Historical reference geometry, NOT a vehicle swept-path simulation.</text><text x="0" y="5" font-family="Arial,sans-serif" font-size="0.4">Bus evidence: https://akkauppi.github.io/mitoitus/evidence.html#bus-turn</text><text x="0" y="-36.2" font-family="Arial,sans-serif" font-size="0.35">TKK 2007 CAR AND BUS TURNING RADII - units: metres (m); geometry 1:1</text><text x="0" y="-37.4" font-family="Arial,sans-serif" font-size="0.23">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#car-turn</text><text x="0" y="-38.3" font-family="Arial,sans-serif" font-size="0.23">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
