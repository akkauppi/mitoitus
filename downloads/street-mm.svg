<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1000 -26330 40500 31330"><title>street reference in mm</title><desc>One SVG user unit equals one millimetres drawing unit. See accompanying DXF and evidence for assumptions.</desc><rect x="0" y="-20000" width="2500" height="20000" fill="none" stroke="#111" stroke-width="15"/><text x="0" y="1000" font-family="Arial,sans-serif" font-size="250">Footway: 2500 mm</text><rect x="7500" y="-20000" width="1750" height="20000" fill="none" stroke="#111" stroke-width="15"/><text x="7500" y="1000" font-family="Arial,sans-serif" font-size="250">One-way cycle lane: 1750 mm</text><rect x="14250" y="-20000" width="3000" height="20000" fill="none" stroke="#111" stroke-width="15"/><text x="14250" y="1000" font-family="Arial,sans-serif" font-size="250">Tree strip (not root volume): 3000 mm</text><rect x="22250" y="-20000" width="3250" height="20000" fill="none" stroke="#111" stroke-width="15"/><text x="22250" y="1000" font-family="Arial,sans-serif" font-size="250">Bus-dimensioned local collector lane: 3250 mm</text><rect x="30500" y="-20000" width="8000" height="20000" fill="none" stroke="#111" stroke-width="15"/><text x="30500" y="1000" font-family="Arial,sans-serif" font-size="250">Light-rail corridor (Espoo 2010): 8000 mm</text><text x="0" y="3000" font-family="Arial,sans-serif" font-size="300">Separate reference strips, not one prescribed street section. Strip length 20 m is illustrative.</text><text x="0" y="4000" font-family="Arial,sans-serif" font-size="300">Espoo 2010 pp. 16-19. Add stops, kerbs, separation, edges, snow, utilities and other required space.</text><text x="0" y="-23000" font-family="Arial,sans-serif" font-size="350">STREET-SPACE WIDTH STRIPS - units: millimetres (mm); geometry 1:1</text><text x="0" y="-24200" font-family="Arial,sans-serif" font-size="230">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#budget</text><text x="0" y="-25100" font-family="Arial,sans-serif" font-size="230">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
