<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1000 -39530 102200 45730"><title>turning reference in mm</title><desc>One SVG user unit equals one millimetres drawing unit. See accompanying DXF and evidence for assumptions.</desc><circle cx="8000" cy="-10000" r="3000" fill="none" stroke="#111" stroke-width="15"/><circle cx="8000" cy="-10000" r="6500" fill="none" stroke="#111" stroke-width="15"/><circle cx="35000" cy="-18000" r="8100" fill="none" stroke="#111" stroke-width="15"/><circle cx="35000" cy="-18000" r="15200" fill="none" stroke="#111" stroke-width="15"/><text x="0" y="0" font-family="Arial,sans-serif" font-size="450">Car/van radii 3000 mm / 6500 mm</text><text x="20000" y="0" font-family="Arial,sans-serif" font-size="450">Bus radii 8100 mm / 15200 mm</text><path d="M63000 -10000A3000 3000 0 0 0 60000 -13000" fill="none" stroke="#111" stroke-width="15"/><path d="M66500 -10000A6500 6500 0 0 0 60000 -16500" fill="none" stroke="#111" stroke-width="15"/><path d="M63000 -10000L66500 -10000" fill="none" stroke="#111" stroke-width="15"/><path d="M60000 -13000L60000 -16500" fill="none" stroke="#111" stroke-width="15"/><path d="M93100 -10000A8100 8100 0 0 0 85000 -18100" fill="none" stroke="#111" stroke-width="15"/><path d="M100200 -10000A15200 15200 0 0 0 85000 -25200" fill="none" stroke="#111" stroke-width="15"/><path d="M93100 -10000L100200 -10000" fill="none" stroke="#111" stroke-width="15"/><path d="M85000 -18100L85000 -25200" fill="none" stroke="#111" stroke-width="15"/><text x="58000" y="0" font-family="Arial,sans-serif" font-size="450">Quarter-circle radius bands; same scale as the circles.</text><text x="0" y="3000" font-family="Arial,sans-serif" font-size="500">Historical reference geometry, NOT a vehicle swept-path simulation.</text><text x="0" y="5000" font-family="Arial,sans-serif" font-size="400">Bus evidence: https://akkauppi.github.io/mitoitus/evidence.html#bus-turn</text><text x="0" y="-36200" font-family="Arial,sans-serif" font-size="350">TKK 2007 CAR AND BUS TURNING RADII - units: millimetres (mm); geometry 1:1</text><text x="0" y="-37400" font-family="Arial,sans-serif" font-size="230">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#car-turn</text><text x="0" y="-38300" font-family="Arial,sans-serif" font-size="230">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
