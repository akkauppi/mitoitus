 y="-46.5879" font-family="Arial,sans-serif" font-size="0.7546">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#parking-layout</text><text x="0" y="-49.5407" font-family="Arial,sans-serif" font-size="0.7546">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
