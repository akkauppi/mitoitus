<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1000 -36550 70000 40550"><title>rescue reference in mm</title><desc>One SVG user unit equals one millimetres drawing unit. See accompanying DXF and evidence for assumptions.</desc><circle cx="12000" cy="-15000" r="5000" fill="none" stroke="#111" stroke-width="15"/><circle cx="12000" cy="-15000" r="10500" fill="none" stroke="#111" stroke-width="15"/><circle cx="40000" cy="-15000" r="5500" fill="none" stroke="#111" stroke-width="15"/><circle cx="40000" cy="-15000" r="12500" fill="none" stroke="#111" stroke-width="15"/><rect x="60000" y="-17000" width="6000" height="13000" fill="none" stroke="#111" stroke-width="15"/><rect x="60000" y="-17000" width="8000" height="13000" fill="none" stroke="#777" stroke-width="15"/><text x="2000" y="-28000" font-family="Arial,sans-serif" font-size="600">Fire engine radii 5000 mm / 10500 mm</text><text x="29000" y="-30000" font-family="Arial,sans-serif" font-size="600">Aerial radii 5500 mm / 12500 mm</text><text x="57000" y="-20000" font-family="Arial,sans-serif" font-size="500">Set-up 6000 mm x 13000 mm</text><text x="57000" y="-18500" font-family="Arial,sans-serif" font-size="500">Target width 8000 mm</text><text x="0" y="0" font-family="Arial,sans-serif" font-size="500">Route width 3500 mm; clear height 4200 mm. HIKLU v1.3 (2024), pp. 7-13.</text><text x="0" y="1500" font-family="Arial,sans-serif" font-size="500">Radius circles only: NOT a vehicle swept-path simulation. No driving allowances are added.</text><text x="0" y="3000" font-family="Arial,sans-serif" font-size="500">Check vehicle model, driving/boom allowances, bearing capacity, gradients, reach and obstacles.</text><text x="0" y="-33000" font-family="Arial,sans-serif" font-size="700">RESCUE REFERENCE GEOMETRY - units: millimetres (mm); geometry 1:1</text><text x="0" y="-34200" font-family="Arial,sans-serif" font-size="450">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#rescue</text><text x="0" y="-35100" font-family="Arial,sans-serif" font-size="450">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
