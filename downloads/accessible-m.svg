<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -9.63 14.9398 19.13"><title>accessible reference in m</title><desc>One SVG user unit equals one metres drawing unit. See accompanying DXF and evidence for assumptions.</desc><circle cx="1.5" cy="-1.5" r="0.75" fill="none" stroke="#111" stroke-width="0.015"/><circle cx="5" cy="-1.5" r="1.25" fill="none" stroke="#111" stroke-width="0.015"/><text x="0.3" y="-3.3" font-family="Arial,sans-serif" font-size="0.22">Wheelchair</text><text x="0.3" y="-2.95" font-family="Arial,sans-serif" font-size="0.22">Diameter 1.5 m</text><text x="3.5" y="-3.3" font-family="Arial,sans-serif" font-size="0.22">Powered wheelchair</text><text x="3.5" y="-2.95" font-family="Arial,sans-serif" font-size="0.22">Diameter 2.5 m</text><rect x="0" y="2" width="1.5" height="3" fill="none" stroke="#111" stroke-width="0.015"/><rect x="3" y="2" width="1.8" height="3" fill="none" stroke="#111" stroke-width="0.015"/><rect x="6" y="3.5" width="0.9" height="1.5" fill="none" stroke="#111" stroke-width="0.015"/><rect x="9" y="0" width="3.6" height="5" fill="none" stroke="#111" stroke-width="0.015"/><text x="0" y="5.6" font-family="Arial,sans-serif" font-size="0.18">Clear route 1.5 m</text><text x="3" y="6" font-family="Arial,sans-serif" font-size="0.18">Passing 1.8 m</text><text x="6" y="5.6" font-family="Arial,sans-serif" font-size="0.18">Beside bench 0.9 m</text><text x="9" y="6" font-family="Arial,sans-serif" font-size="0.18">Bay 3.6 m x 5 m</text><text x="0" y="7" font-family="Arial,sans-serif" font-size="0.18">Route length 3 m and bench-space depth 1.5 m are illustrative, not sourced requirements.</text><text x="0" y="7.4" font-family="Arial,sans-serif" font-size="0.18">SuRaKu 2008 cards 1-4. Separate transfer/lift space and approach must be checked.</text><text x="0" y="8" font-family="Arial,sans-serif" font-size="0.18">Width evidence: https://akkauppi.github.io/mitoitus/evidence.html#walking</text><text x="0" y="8.5" font-family="Arial,sans-serif" font-size="0.18">Bay / bench evidence: https://akkauppi.github.io/mitoitus/evidence.html#arrival</text><text x="0" y="-6.3" font-family="Arial,sans-serif" font-size="0.35">ACCESSIBLE MOVEMENT - units: metres (m); geometry 1:1</text><text x="0" y="-7.5" font-family="Arial,sans-serif" font-size="0.23">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#turning</text><text x="0" y="-8.4" font-family="Arial,sans-serif" font-size="0.23">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
