<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -28.33 106 37.83"><title>buildings reference in m</title><desc>One SVG user unit equals one metres drawing unit. See accompanying DXF and evidence for assumptions.</desc><rect x="0" y="-11" width="26" height="11" fill="none" stroke="#111" stroke-width="0.015"/><text x="0" y="-13" font-family="Arial,sans-serif" font-size="0.55">Slab module</text><text x="0" y="2" font-family="Arial,sans-serif" font-size="0.45">26 m x 11 m</text><rect x="33" y="-20" width="20" height="20" fill="none" stroke="#111" stroke-width="0.015"/><text x="33" y="-22" font-family="Arial,sans-serif" font-size="0.55">Square point block</text><text x="33" y="2" font-family="Arial,sans-serif" font-size="0.45">20 m x 20 m</text><rect x="60" y="-9" width="9" height="9" fill="none" stroke="#111" stroke-width="0.015"/><text x="60" y="-11" font-family="Arial,sans-serif" font-size="0.55">Small block module</text><text x="60" y="2" font-family="Arial,sans-serif" font-size="0.45">9 m x 9 m</text><rect x="76" y="-9.5" width="6" height="9.5" fill="none" stroke="#111" stroke-width="0.015"/><text x="76" y="-11.5" font-family="Arial,sans-serif" font-size="0.55">Row dwelling</text><text x="76" y="2" font-family="Arial,sans-serif" font-size="0.45">6 m x 9.5 m</text><rect x="89" y="-10" width="15" height="10" fill="none" stroke="#111" stroke-width="0.015"/><text x="89" y="-12" font-family="Arial,sans-serif" font-size="0.55">Detached, one storey</text><text x="89" y="2" font-family="Arial,sans-serif" font-size="0.45">15 m x 10 m</text><text x="0" y="5" font-family="Arial,sans-serif" font-size="0.5">Representative values within TKK 2007 ranges, not prescriptions. Repeat modules as labelled.</text><text x="0" y="7" font-family="Arial,sans-serif" font-size="0.4">Other footprint evidence: https://akkauppi.github.io/mitoitus/evidence.html#building-rows</text><text x="0" y="8.5" font-family="Arial,sans-serif" font-size="0.4">Detached-house evidence: https://akkauppi.github.io/mitoitus/evidence.html#building-detached</text><text x="0" y="-25" font-family="Arial,sans-serif" font-size="0.35">BUILDING FOOTPRINT REPRESENTATIVES - units: metres (m); geometry 1:1</text><text x="0" y="-26.2" font-family="Arial,sans-serif" font-size="0.23">Evidence: https://akkauppi.github.io/mitoitus/evidence.html#building-blocks</text><text x="0" y="-27.1" font-family="Arial,sans-serif" font-size="0.23">Finnish source dimensions; 1 ft = 0.3048 m exactly. Teaching reference, not construction details.</text></svg>
