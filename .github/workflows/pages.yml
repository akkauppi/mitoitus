name: Publish rulebook
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install locked test dependency
        run: npm ci --prefix lab --ignore-scripts
      - name: Check metric geometry
        run: npm test --prefix lab
      - name: Check build and source preservation
        run: python3 -m unittest discover -s lab/tests -p 'test_*.py'
      - name: Build verified public artifact
        run: python3 lab/scripts/prepare-release.py
      - name: Check public links and preserved CAD
        run: python3 lab/scripts/verify-release.py lab/.build/release
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: lab/.build/release
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
