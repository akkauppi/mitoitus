name: Publish rulebook
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Protect previously locked assertion revisions
        if: github.event_name == 'push'
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$PREVIOUS_SHA"
          PYTHONPATH=lab/scripts python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          from curated_reference import LOCK_PATH, verify_previous_lock

          previous = subprocess.run(['git', 'show', os.environ['PREVIOUS_SHA']+':'+LOCK_PATH],
                                    capture_output=True)
          if previous.returncode:
              tree = subprocess.check_output(['git','ls-tree',os.environ['PREVIOUS_SHA'],LOCK_PATH])
              if tree:
                  raise RuntimeError(previous.stderr.decode())
          else:
              verify_previous_lock(json.loads(previous.stdout), json.loads(Path(LOCK_PATH).read_bytes()))
          PYTHON
      - name: Install locked test dependency
        run: npm ci --prefix lab --ignore-scripts
      - name: Check metric geometry
        run: npm test --prefix lab
      - name: Check build and source preservation
        run: python3 -m unittest discover -s lab/tests -p 'test_*.py'
      - name: Build verified public artifact
        run: python3 lab/scripts/prepare-release.py
      - name: Check public links and preserved CAD
        run: python3 lab/scripts/verify-release.py lab/.build/release
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: lab/.build/release
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
